# Genera un .ipa FIRMADO (necesita cuenta de Apple Developer, 99 $/año).
# Secrets necesarios (Settings > Secrets and variables > Actions):
#   P12_BASE64         certificado Apple Distribution (.p12) en base64
#   P12_PASSWORD       contraseña del .p12
#   PROFILE_BASE64     perfil de aprovisionamiento (.mobileprovision) en base64
#   KEYCHAIN_PASSWORD  cualquier contraseña inventada
# Opcional, para subir a TestFlight:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_BASE64 (clave .p8 de App Store Connect en base64)
name: Release

on:
  workflow_dispatch:
    inputs:
      method:
        description: "Tipo de exportación"
        type: choice
        options: [release-testing, app-store-connect]
        default: release-testing
      upload_testflight:
        description: "Subir a TestFlight (solo app-store-connect)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generar proyecto
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Instalar certificado y perfil
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KC=$RUNNER_TEMP/build.keychain-db
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          echo "$PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/app.mobileprovision
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security set-keychain-settings -lut 21600 $KC
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KC
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KC
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KC
          security list-keychain -d user -s $KC
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp $RUNNER_TEMP/app.mobileprovision "$d/"
          done
          # Datos del perfil: nombre, equipo y bundle id
          security cms -D -i $RUNNER_TEMP/app.mobileprovision > $RUNNER_TEMP/profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $RUNNER_TEMP/profile.plist)
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" $RUNNER_TEMP/profile.plist)
          APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" $RUNNER_TEMP/profile.plist)
          BUNDLE_ID=${APP_ID#*.}
          echo "Perfil: $PROFILE_NAME · Equipo: $TEAM_ID · Bundle: $BUNDLE_ID"
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_ENV

      - name: Archivar
        run: |
          xcodebuild archive \
            -project DeyeLocal.xcodeproj -scheme DeyeLocal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/DeyeLocal.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" | tail -30

      - name: Exportar IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${{ inputs.method }}</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/DeyeLocal.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/out
          ls -la $RUNNER_TEMP/out

      - uses: actions/upload-artifact@v4
        with:
          name: DeyeLocal-ipa
          path: ${{ runner.temp }}/out/*.ipa

      - name: Subir a TestFlight
        if: inputs.upload_testflight && inputs.method == 'app-store-connect'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -t ios -f $RUNNER_TEMP/out/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Limpiar keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain-db || true
