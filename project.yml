# Proyecto generado con XcodeGen:  brew install xcodegen && xcodegen generate
name: DeyeLocal
options:
  bundleIdPrefix: com.thermoaqua
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  DeyeLocal:
    type: application
    platform: iOS
    sources:
      - path: DeyeLocal
    info:
      path: DeyeLocal/Info.plist
      properties:
        CFBundleDisplayName: Deye Local
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "Deye Local se conecta al logger de tu microinversor en la red WiFi de casa para leer la producción y enviar órdenes."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thermoaqua.deyelocal
        PRODUCT_NAME: DeyeLocal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic

  DeyeLocalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DeyeLocalTests
    dependencies:
      - target: DeyeLocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thermoaqua.deyelocal.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DeyeLocal:
    build:
      targets:
        DeyeLocal: all
        DeyeLocalTests: [test]
    test:
      targets:
        - DeyeLocalTests
    archive:
      config: Release
